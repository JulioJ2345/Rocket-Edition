<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#121827"><meta name="description" content="Tu caja Nuzlocke sin conexión"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="stylesheet" href="style.css"><title>Rocket Nuzlocke</title></head><body><header><div class="brand"><span class="rocket">R</span><div><strong>ROCKET BOX</strong><small>NUZLOCKE · 3 VIDAS</small></div></div><button id="install" class="ghost hidden">Instalar</button></header><main><section class="stats" id="stats"></section><nav id="tabs"><button data-tab="team" class="active">Equipo</button><button data-tab="box">Caja</button><button data-tab="grave">Cementerio</button><button data-tab="zones">Zonas</button><button data-tab="settings">Datos</button></nav><section id="content"></section></main><button id="add" class="fab" aria-label="Añadir Pokémon">＋</button><dialog id="editor"><form id="pokeForm"><div class="dialoghead"><h2 id="editTitle">Nuevo Pokémon</h2><button type="button" class="close" data-close>✕</button></div><div class="formgrid"><label>Especie *<input name="species" required placeholder="Zubat" list="speciesList"><small id="speciesInfo" aria-live="polite">Al salir del campo, se buscarán número y tipos automáticamente.</small></label><label>Mote<input name="nickname" placeholder="Opcional"></label><label>Nivel<input name="level" type="number" min="1" max="100" value="5" required></label><label>Vidas restantes<select name="lives"><option>3</option><option>2</option><option>1</option><option>0</option></select></label><label>Naturaleza<input name="nature" placeholder="Alegre"></label><label>Habilidad<input name="ability" placeholder="Foco Interno"></label><label>Tipo 1<input name="type1" placeholder="Veneno" list="types"></label><label>Tipo 2<input name="type2" placeholder="Volador" list="types"></label><label>Objeto<input name="item" placeholder="Sin objeto"></label><label>Origen<select name="origin"><option value="Captura">Captura</option><option value="Robo">Robo</option><option value="Regalo">Regalo</option><option value="Inicial">Inicial</option></select></label><label>Zona<input name="zone" placeholder="Prado Inta"></label><label>Ubicación<select name="location"><option value="team">Equipo</option><option value="box">Caja</option><option value="grave">Cementerio</option></select></label><label>N.º Pokédex (automático o manual)<input name="dex" type="number" min="1" max="9999" placeholder="41"></label></div><button type="button" id="uploadSprite" class="ghost">Asignar sprite (imagen local)</button><h3>Movimientos</h3><div class="formgrid"><label>Movimiento 1<input name="move1"></label><label>Movimiento 2<input name="move2"></label><label>Movimiento 3<input name="move3"></label><label>Movimiento 4<input name="move4"></label></div><label>Notas<textarea name="notes" rows="3"></textarea></label><div class="actions"><button type="button" id="deletePoke" class="danger">Eliminar</button><button type="submit" class="primary">Guardar Pokémon</button></div></form></dialog><dialog id="zoneEditor"><form id="zoneForm"><div class="dialoghead"><h2>Registrar zona</h2><button type="button" class="close" data-close>✕</button></div><label>Nombre de zona *<input name="name" required></label><label>Encuentro<select name="state"><option value="available">Disponible</option><option value="used">Utilizado</option><option value="lost">Perdido</option></select></label><label>Notas<textarea name="notes" rows="3"></textarea></label><div class="actions"><button type="button" id="deleteZone" class="danger">Eliminar</button><button class="primary">Guardar zona</button></div></form></dialog><datalist id="types"><option>Normal</option><option>Fuego</option><option>Agua</option><option>Planta</option><option>Eléctrico</option><option>Hielo</option><option>Lucha</option><option>Veneno</option><option>Tierra</option><option>Volador</option><option>Psíquico</option><option>Bicho</option><option>Roca</option><option>Fantasma</option><option>Dragón</option><option>Siniestro</option><option>Acero</option><option>Hada</option></datalist><datalist id="speciesList"></datalist><input id="importFile" type="file" accept=".json,application/json" hidden><input id="spriteFolder" type="file" accept="image/png,image/webp" webkitdirectory directory multiple hidden><input id="spriteFile" type="file" accept="image/png,image/jpeg,image/webp" hidden><div id="toast" role="status"></div><script src="app.js?v=7" defer></script></body></html>
